name: CI

# Runs the checks a release depends on, on every pull request and on the
# long-lived branches. Publish and deploy keep their own workflows.
on:
  pull_request:
  push:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit the published surface
        # Consumers must never inherit an advisory.
        run: npm audit --omit=dev --audit-level=high

      - name: Audit every dependency (OSV)
        # Development toolchain included; exceptions need a reason in
        # osv-scanner.toml. --self-test proves the detector is still working.
        run: npm run audit:deps -- --self-test

      - name: Test with coverage
        # Enforces the thresholds in vitest.config.ts (>=90% statements on the
        # shipped surface). pipefail matters: without it, `tee` would mask a
        # failing threshold and the check would pass while coverage is broken.
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage.log

      - name: Publish the coverage summary
        if: always()
        shell: bash
        run: |
          # Actions exports FORCE_COLOR=1, so coverage.log carries ANSI escapes and
          # "^Statements" matches nothing until they are stripped. Verified locally:
          # with FORCE_COLOR=1 the raw grep finds 0 lines, the stripped one finds 4.
          sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' coverage.log > coverage.txt || true
          {
            echo "## Test coverage (shipped surface)"
            echo
            echo '```text'
            grep -E "^(Statements|Branches|Functions|Lines)[[:space:]]" coverage.txt ||
              echo "no coverage table found in the log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build docs site
        run: npm run build

      - name: Build npm package
        run: npm run build:lib

      - name: Check the package payload
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          grep -q "dist/night-city-ui.js" pack.log
          grep -q "dist/style.css" pack.log
          grep -q "CHANGELOG.md" pack.log
          if grep -q "dist/assets/" pack.log; then
            echo "::error::docs-site chunks would ship inside the package"
            exit 1
          fi
