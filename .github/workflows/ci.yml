name: CI

# Runs the checks a release depends on, on every pull request and on the
# long-lived branches. Publish and deploy keep their own workflows.
on:
  pull_request:
  push:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit the published surface
        # Consumers must never inherit an advisory; dev-only advisories are
        # tracked in publish-npm.yml (picomatch has no upstream fix yet).
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Build docs site
        run: npm run build

      - name: Build npm package
        run: npm run build:lib

      - name: Check the package payload
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          grep -q "dist/night-city-ui.js" pack.log
          grep -q "dist/style.css" pack.log
          grep -q "CHANGELOG.md" pack.log
          if grep -q "dist/assets/" pack.log; then
            echo "::error::docs-site chunks would ship inside the package"
            exit 1
          fi
