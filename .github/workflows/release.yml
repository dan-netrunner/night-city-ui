name: GitHub Release

# Opens the release that belongs to a version tag and attaches the exact
# tarball npm received. Runs automatically when `npm version` pushes a tag, and
# can be dispatched afterwards to backfill a tag that predates this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # OIDC identity for Sigstore signing
      attestations: write # persisting the attestation record is its own scope
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check whether the release already exists
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release for ${{ steps.tag.outputs.tag }} already exists; only re-attesting its assets"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the package
        run: npm run build:lib

      - name: Pack
        run: npm pack

      - name: Generate the SBOM
        # CycloneDX over the runtime dependency graph. The component list is
        # empty by design - the package ships no runtime dependencies - and that
        # emptiness is exactly what a consumer wants to read from a machine
        # readable inventory. --omit=dev because the toolchain is not what ships.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sbom="night-city-ui-${TAG#v}.cdx.json"
          npm sbom --sbom-format cyclonedx --omit=dev > "$sbom"
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            const pkg = require("./package.json");
            const doc = JSON.parse(fs.readFileSync(file, "utf8"));
            // npm names the root component after the directory, not package.json.
            doc.metadata.component.name = pkg.name;
            doc.metadata.component.version = pkg.version;
            fs.writeFileSync(file, JSON.stringify(doc, null, 2) + "\n");
            const purl = doc.metadata.component.purl ?? "";
            if (doc.bomFormat !== "CycloneDX" || !purl.endsWith(pkg.name + "@" + pkg.version)) {
              console.error("unexpected SBOM:", doc.bomFormat, purl);
              process.exit(1);
            }
            console.log("SBOM", doc.bomFormat, doc.specVersion, purl, "| components:", (doc.components || []).length);
          ' "$sbom"

      - name: Create the release
        if: steps.guard.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          notes="npm install night-city-ui@${version}

          Built from this tag by the GitHub Release workflow; the same version on
          npm carries an npm provenance attestation from OIDC trusted publishing.
          Assets: the tarball (also shipped with CHANGELOG.md inside) and a
          CycloneDX SBOM of its runtime dependencies.
          Docs: https://dan-netrunner.github.io/night-city-ui/"
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "night-city-ui ${version}" \
            --notes "$notes" \
            night-city-ui-*.tgz night-city-ui-*.cdx.json

      - name: Take the published asset when the release already exists
        # A re-run has to attest the bytes that are actually downloadable, not a
        # fresh rebuild, or the attestation subject would not match the asset.
        if: steps.guard.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          before="$(sha256sum night-city-ui-*.tgz | cut -d' ' -f1)"
          gh release download "$TAG" -p "night-city-ui-*.tgz" --clobber
          after="$(sha256sum night-city-ui-*.tgz | cut -d' ' -f1)"
          if [ "$before" != "$after" ]; then
            echo "This build ($before) differs from the published asset ($after);"
            echo "the attestation below will describe the published asset."
          fi

      - name: Attest the artifact
        # Provenance for the uploaded tarball: this is what the OpenSSF
        # Signed-Releases check counts. gh has no `attestation sign` subcommand,
        # so the official action does it, and persisting the record needs the
        # attestations permission scope on the job token.
        # No continue-on-error here: an unsigned release is a failure worth
        # seeing, because a silently missing attestation is what previously left
        # the released asset unverifiable.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: night-city-ui-*.tgz

      - name: Publish the signature and the attestation as release assets
        # GitHub keeps the bundle in attestation storage, reachable by artifact
        # digest, but that is invisible on the release itself - it is also why
        # OpenSSF's Signed-Releases reported 0 for a release that *was* attested.
        # `.sigstore.json` (a signature) and `.intoto.jsonl` (provenance) are the
        # asset names those probes look for. The action reports where it wrote the
        # bundle; it does not take a destination.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          WRITTEN_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          bundle="night-city-ui-${VERSION}.tgz.sigstore.json"
          statement="night-city-ui-${VERSION}.tgz.intoto.jsonl"
          if [ -z "$WRITTEN_BUNDLE" ] || [ ! -s "$WRITTEN_BUNDLE" ]; then
            echo "::error::the attestation action reported no bundle at '$WRITTEN_BUNDLE'"
            exit 1
          fi
          cp "$WRITTEN_BUNDLE" "$bundle"
          # The field is dspEnvelope in the Sigstore protobuf JSON and
          # dsseEnvelope in GitHub's storage API: accept either, accept nothing
          # that is not a signed in-toto statement.
          jq -c '(.dsseEnvelope // .dspEnvelope)' "$bundle" > "$statement"
          jq -e 'has("payloadType") and has("payload") and (.signatures | length > 0)' "$statement" > /dev/null
          gh release upload "$TAG" "$bundle" "$statement" --clobber

      - name: Confirm the attestation was stored
        # v0.1.3 shipped unsigned because this step was best-effort: the action
        # did fail (missing attestations permission) and the run still went green.
        # Assert the attestation id so a missing record can never be invisible.
        run: |
          id="${{ steps.attest.outputs.attestation-id }}"
          if [ -z "$id" ]; then
            echo "::error::the attestation step produced no attestation id"
            exit 1
          fi
          echo "stored attestation id $id"
