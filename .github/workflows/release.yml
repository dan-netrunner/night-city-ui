name: GitHub Release

# Opens the release that belongs to a version tag and attaches the exact
# tarball npm received. Runs automatically when `npm version` pushes a tag, and
# can be dispatched afterwards to backfill a tag that predates this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # signing the artifact attestation
    steps:
      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Guard against a tag that is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::release for ${{ steps.tag.outputs.tag }} already exists"
            exit 1
          fi

      - name: Build the package
        run: npm run build:lib

      - name: Pack
        run: npm pack

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          notes="npm install night-city-ui@${version}

          Built from this tag by the GitHub Release workflow; the same version on
          npm carries an npm provenance attestation from OIDC trusted publishing.
          Docs: https://dan-netrunner.github.io/night-city-ui/"
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "night-city-ui ${version}" \
            --notes "$notes" \
            night-city-ui-*.tgz

      - name: Attest the artifact
        # Provenance for the uploaded tarball: this is what the OpenSSF
        # Signed-Releases check counts, and it is the reason the release exists
        # as a GitHub Release and not only on npm. gh has no `attestation sign`
        # subcommand, so the official action does it. Best-effort on purpose: a
        # signing problem must not leave a version unreleased.
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: night-city-ui-*.tgz
          bundle-path: attestation.json
