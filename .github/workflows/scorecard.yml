name: OpenSSF Scorecard

# Publishes Scorecard results for this repository. Without this the project is
# never analysed, so registries and dashboards (Socket, deps.dev, the repo's own
# Security tab) have no supply-chain grade to show.
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write # proof that the results came from this repo and workflow
      security-events: write # upload the SARIF report
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Without a token that may read branch protection the check reports
          # "internal error" instead of a score. Create a fine-grained PAT with
          # no permissions except "Administration: read", store it as the
          # SCORECARD_REPO_TOKEN secret, and it is used here; until then the
          # default workflow token is used and Branch-Protection stays unscored.
          repo_token: ${{ secrets.SCORECARD_REPO_TOKEN || github.token }}

      - name: Upload the SARIF report
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
