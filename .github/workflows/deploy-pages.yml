name: Deploy to GitHub Pages

# Builds on every push/merge to main and publishes dist/ to the gh-pages branch.
# GitHub Pages must be configured as: Settings -> Pages -> Source:
# "Deploy from a branch" -> Branch: gh-pages -> Folder: / (root).
#
# Do not trigger this workflow on pushes to gh-pages: the action itself writes
# there, so it would redeploy in a loop.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Single-commit branch: no build history accumulates.
          force_orphan: true
