name: Publish to npm

# Publishes the library build of this package to the npm registry.
#
# Auth is OIDC trusted publishing: no token is stored anywhere. The
# package settings on npmjs.com must list this workflow as a trusted
# publisher (GitHub Actions, repo dan-netrunner/night-city-ui, workflow
# publish-npm.yml, environment "npm") and allow `npm publish`.
# See docs.npmjs.com/trusted-publishers.
#
# Runs on every push/merge to main, but only publishes when package.json
# carries a version that does not exist on npm yet. Bump the version to ship.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC auth and provenance

concurrency:
  group: "npm-publish"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          # no dependency cache in release builds

      - name: Upgrade npm
        # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Read package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already published
        id: check
        run: |
          # curl, not `npm view`: npm caches the 404 for the version about to be published.
          if curl -fs -o /dev/null "https://registry.npmjs.org/${{ steps.pkg.outputs.name }}/${{ steps.pkg.outputs.version }}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        if: steps.check.outputs.published == 'false'
        # prepublishOnly runs npm run build:lib (dist/ + type declarations).
        # npm exchanges the GitHub OIDC token for a short-lived publish token.
        run: npm publish --provenance --access public

      - name: Verify the version reached the registry
        if: steps.check.outputs.published == 'false'
        run: |
          url="https://registry.npmjs.org/${{ steps.pkg.outputs.name }}/${{ steps.pkg.outputs.version }}"
          # Registry reads can lag a few seconds behind the upload.
          for attempt in $(seq 1 10); do
            if curl -fs -o /dev/null "$url"; then
              echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is live on npm."
              exit 0
            fi
            sleep 6
          done
          echo "::error::npm accepted the upload but the version is not public. It was staged for approval."
          echo "Approve it once, or set the trusted publisher to allow 'npm publish':"
          echo "  npm login"
          echo "  npm stage list ${{ steps.pkg.outputs.name }}"
          echo "  npm stage approve <stage-id>"
          exit 1

      - name: Report skip
        if: steps.check.outputs.published == 'true'
        run: |
          echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already on npm."
          echo "Bump the version in package.json to publish a new release."
