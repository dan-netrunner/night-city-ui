name: Publish to npm

# Publishes the library build of this package to the npm registry.
#
# Auth is OIDC trusted publishing: no token is stored anywhere. The
# package settings on npmjs.com must list this workflow as a trusted
# publisher (GitHub Actions, repo dan-netrunner/night-city-ui, workflow
# publish-npm.yml, environment "npm") and allow `npm publish`.
# See docs.npmjs.com/trusted-publishers.
#
# Runs on every push/merge to main, but only publishes when package.json
# carries a version that does not exist on npm yet. Bump the version to ship.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC auth and provenance

concurrency:
  group: "npm-publish"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm 11.19, and OIDC trusted publishing needs npm
          # >= 11.5.1. Installing npm inside the job would count as an unpinned
          # dependency in the OpenSSF Pinned-Dependencies check.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # no dependency cache in release builds

      - name: Check the toolchain can publish
        run: |
          v="$(npm --version)"
          echo "node $(node --version), npm $v"
          if [ "${v%%.*}" -lt 11 ]; then
            echo "::error::npm $v cannot do OIDC trusted publishing (needs >= 11.5.1)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        # Never publish a build the suite has not seen.
        run: npm test

      - name: Audit the published surface
        # Gate: whatever a consumer installs with this package must be clean.
        # Today that is nothing (dependencies = {}), so this only becomes real
        # if someone adds a runtime dependency.
        run: |
          npm audit --omit=dev --audit-level=high
          node -e "const d=require('./package.json').dependencies||{};console.log('runtime dependencies:', Object.keys(d).join(', ') || 'none')"

      - name: Audit every dependency (OSV)
        # The toolchain half of the policy in SECURITY.md: a development
        # advisory blocks a release unless osv-scanner.toml explains why.
        run: npm run audit:deps -- --self-test

      - name: Read package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already published
        id: check
        run: |
          # curl, not `npm view`: npm caches the 404 for the version about to be published.
          if curl -fs -o /dev/null "https://registry.npmjs.org/${{ steps.pkg.outputs.name }}/${{ steps.pkg.outputs.version }}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        if: steps.check.outputs.published == 'false'
        # prepublishOnly runs npm run build:lib (dist/ + type declarations).
        # npm exchanges the GitHub OIDC token for a short-lived publish token.
        run: npm publish --provenance --access public

      - name: Verify the version reached the registry
        if: steps.check.outputs.published == 'false'
        run: |
          url="https://registry.npmjs.org/${{ steps.pkg.outputs.name }}/${{ steps.pkg.outputs.version }}"
          # The registry read path lags the upload by up to a couple of minutes.
          for attempt in $(seq 1 20); do
            if curl -fs -o /dev/null "$url"; then
              echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is live on npm."
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm accepted the upload but the version is not public. It was staged for approval."
          echo "Approve it once, or set the trusted publisher to allow 'npm publish':"
          echo "  npm login"
          echo "  npm stage list ${{ steps.pkg.outputs.name }}"
          echo "  npm stage approve <stage-id>"
          exit 1

      - name: Report skip
        if: steps.check.outputs.published == 'true'
        run: |
          echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already on npm."
          echo "Bump the version in package.json to publish a new release."
