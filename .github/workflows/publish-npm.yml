name: Publish to npm

# Publishes the library build of this package to the npm registry.
# The token lives in the repository secret NPM_SECRET, scoped to the
# environment "npm" (Settings -> Environments -> npm).
#
# Runs on every push/merge to main, but only publishes when package.json
# carries a version that does not exist on npm yet. Bump the version to ship.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

concurrency:
  group: "npm-publish"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Read package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already published
        id: check
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        if: steps.check.outputs.published == 'false'
        # prepublishOnly runs npm run build:lib (dist/ + type declarations).
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}

      - name: Report skip
        if: steps.check.outputs.published == 'true'
        run: |
          echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already on npm."
          echo "Bump the version in package.json to publish a new release."
