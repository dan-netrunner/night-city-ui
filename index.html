<!doctype html>
<html lang="en" data-theme="neokitsch">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0f" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Night City UI — Cyberpunk component themes</title>
    <meta
      name="description"
      content="A React component kit with four Cyberpunk 2077-inspired themes: Scrap//Tech, Tacky//Futurism, Corpo//Brutalism and Hyper//Opulence."
    />
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong style.
      try {
        var t = localStorage.getItem("nc-theme");
        if (["entropism", "kitsch", "neomilitarism", "neokitsch"].indexOf(t) !== -1) {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').content =
            { entropism: "#160d10", kitsch: "#190f14", neomilitarism: "#0c0c0b", neokitsch: "#0b0c0f" }[t];
        }
      } catch (e) {}
    </script>
    <script>
      window.addEventListener("load", async () => { try {
        const w = (s) => { const el = document.querySelector(s); return el ? Math.round(el.getBoundingClientRect().width) : -1; };
        const r = (s) => { const el = document.querySelector(s); if (!el) return null; const b = el.getBoundingClientRect(); return [Math.round(b.x), Math.round(b.y), Math.round(b.width), Math.round(b.height)]; };
        const out = {};
        for (const t of ["neokitsch", "entropism", "kitsch", "neomilitarism"]) {
          document.documentElement.dataset.theme = t;
          await new Promise((res) => setTimeout(res, 600));
          out[t] = { inner: r(".topbar__inner"), brand: r(".brand"), nav: r(".mainnav"), sw: r(".theme-switch") };
        }
        const d = document.createElement("pre"); d.id = "measure"; d.textContent = "M:" + JSON.stringify(out); document.body.appendChild(d);
      } catch (e) { const d = document.createElement("pre"); d.id = "measure"; d.textContent = "ERR:" + e; document.body.appendChild(d); }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
